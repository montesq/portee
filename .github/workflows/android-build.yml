name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: portee-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Build $TAG" \
            --notes "Build automatique depuis le commit ${{ github.sha }}."
